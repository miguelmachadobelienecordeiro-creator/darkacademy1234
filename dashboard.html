<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dark Academy Dashboard</title>
<link rel="stylesheet" href="style.css">
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database.js"></script>
<script src="script.js" defer></script>
</head>
<body>
    <div class="top-bar">
        <h1>Dark Academy</h1>
        <a id="discord-link" href="#" target="_blank">
            <img src="discord-icon.png" alt="Discord" class="discord-icon">
        </a>
    </div>

    <div class="profile-section">
        <img id="profile-pic" src="default-profile.png" class="profile-pic">
        <span id="welcome">Bem-vindo, Usuário</span>
        <button onclick="editProfile()" class="btn futuristic-btn">Editar Perfil</button>
    </div>

    <div class="modes">
        <button onclick="showMode('bedwars')" class="btn futuristic-btn">BedWars</button>
        <button onclick="showMode('fortnite')" class="btn futuristic-btn">Fortnite</button>
        <button onclick="showMode('freefire')" class="btn futuristic-btn">Free Fire</button>
        <button onclick="showMode('clashroyale')" class="btn futuristic-btn">Clash Royale</button>
    </div>

    <div id="mode-container" class="mode-container"></div>

    <div id="notifications" class="notifications"></div>

    <div class="rankings">
        <div id="ranking-bedwars" class="ranking">
            <h3>BedWars</h3>
        </div>
        <div id="ranking-fortnite" class="ranking">
            <h3>Fortnite</h3>
        </div>
        <div id="ranking-freefire" class="ranking">
            <h3>Free Fire</h3>
        </div>
        <div id="ranking-clashroyale" class="ranking">
            <h3>Clash Royale</h3>
        </div>
    </div>

    <div id="validation-container" class="validation-container"></div>

    <div id="chat-container" class="chat-container">
        <h3>Chat com <span id="chat-with"></span></h3>
        <div id="chat-messages" class="chat-messages"></div>
        <input type="text" id="chat-input" placeholder="Digite sua mensagem...">
        <button onclick="sendMessage()" class="btn futuristic-btn">Enviar</button>
        <button onclick="closeChat()" class="btn futuristic-btn">Fechar</button>
    </div>
</body>
</html>
