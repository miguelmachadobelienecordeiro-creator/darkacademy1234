<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Dark Academy - Login</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="login-container">
    <h1>Login</h1>
    <input type="text" id="login-email" placeholder="Email" class="input-neon">
    <input type="password" id="login-password" placeholder="Senha" class="input-neon">
    <button onclick="login()" class="btn-neon">Entrar</button>
    <p>Não tem conta? <a href="register.html">Cadastrar</a></p>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<!-- Script principal -->
<script src="script.js"></script>

</body>
</html>
